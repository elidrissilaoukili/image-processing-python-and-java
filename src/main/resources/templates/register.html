<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="max-w-md w-full p-8 bg-white rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold text-gray-900 text-center">Sign Up</h2>

    <form class="mt-6 space-y-4" th:action="@{/register}" method="post" th:object="${registerDTO}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" th:field="*{email}"
                   class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <p th:if="${#fields.hasErrors('email')}" class="text-red-500 text-sm" th:errors="*{email}"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" th:field="*{password}"
                   class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <p th:if="${#fields.hasErrors('password')}" class="text-red-500 text-sm" th:errors="*{password}"></p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" th:field="*{confirmPassword}"
                   class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <p th:if="${#fields.hasErrors('confirmPassword')}" class="text-red-500 text-sm" th:errors="*{confirmPassword}"></p>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-md shadow-md hover:bg-blue-500 transition">
            Sign Up
        </button>

        <div class="text-center mt-3">
            <p class="text-sm text-gray-600">Already have an account? <a href="/login" class="text-blue-600 hover:underline">Login</a></p>
        </div>

        <div th:if="${success}" class="text-center text-green-600 font-semibold">
            Registered successfully! <a href="/login" class="text-blue-600 hover:underline">Login</a>
        </div>
    </form>

    <div class="mt-4 text-center">
        <a href="/" class="text-sm text-gray-700 hover:underline">Go to Home</a>
    </div>
</div>
</body>
</html>
