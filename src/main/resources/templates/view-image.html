<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Image Processing</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/js/tailwindcss.js"></script>
    <script th:src="@{/js/tailwindcss.js}"></script>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="bg-gray-800 p-2 mb-5">
      <div class="flex items-center justify-end">
        <a
          href="/"
          class="text-white text-lg font-semibold m-4 hover:text-gray-300"
          >Image Porcessing</a
        >
        <a
          href="/view-image"
          class="text-white text-lg font-semibold m-4 hover:text-gray-300"
          >View Image</a
        >
        <form th:action="@{/logout}" method="post">
          <button
            type="submit"
            class="bg-red-500 text-white py-1 px-2 rounded-md shadow-md hover:bg-red-600 transition"
          >
            Logout
          </button>
        </form>
      </div>
    </nav>

    <div class="max-w-7xl mt-5 w-full" style="margin: auto">
      <!-- Uploads Section -->
      <h2 class="text-xl font-bold mb-3">Uploads</h2>
      <div class="flex flex-wrap gap-4">
        <div th:each="image : ${uploadImages}">
          <img
            th:src="${image}"
            class="w-48 h-48 object-cover cursor-pointer"
            onclick="openModal(this.src)"
          />
        </div>
      </div>

      <!-- Outputs Section -->
      <h2 class="text-xl font-bold mt-8 mb-3">Outputs</h2>
      <div class="flex flex-wrap gap-4 mb-8">
        <div th:each="image : ${outputImages}">
          <img
            th:src="${image}"
            class="w-48 h-48 object-cover cursor-pointer"
            onclick="openModal(this.src)"
          />
        </div>
      </div>

      <!-- Modal for Image View -->
      <div
        id="imageModal"
        class="hidden fixed top-0 left-0 w-full h-full bg-black bg-opacity-80 flex items-center justify-center"
      >
        <div class="relative bg-white p-5 rounded-lg shadow-lg">
          <button
            onclick="closeModal()"
            class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded"
          >
            ✖
          </button>
          <img id="modalImage" class="max-w-full max-h-[80vh]" />
          <a
            id="downloadBtn"
            class="block mt-3 bg-blue-500 text-white px-4 py-2 text-center rounded"
            download
            >Download</a
          >
        </div>
      </div>
    </div>

    <script>
      function openModal(src) {
        document.getElementById("modalImage").src = src;
        document.getElementById("downloadBtn").href = src;
        document.getElementById("imageModal").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("imageModal").classList.add("hidden");
      }
    </script>
  </body>
</html>
