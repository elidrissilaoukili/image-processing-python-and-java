<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="max-w-sm w-full p-8 bg-white rounded-lg shadow-lg">
    <div class="text-center">
        <img class="mx-auto h-20 w-auto" th:src="@{/images/logo.png}" alt="Logo">
        <h4 class="text-xl font-semibold text-gray-900 mt-4">Sign in to your account</h4>
    </div>

    <form class="mt-6 space-y-5" th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded-md">
            <p>Email or password incorrect</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700" for="email">Email</label>
            <input id="email" name="email" type="text" placeholder="Enter your email"
                   class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700" for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password"
                   class="mt-1 block w-full px-3 py-2 border rounded-md shadow-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-md shadow-md hover:bg-blue-500 transition">
            Log in
        </button>

        <div class="text-center mt-3">
            <a href="/register" class="block w-full bg-gray-800 text-white py-2 rounded-md shadow-md hover:bg-gray-700 transition">
                Create new account
            </a>
        </div>
    </form>
</div>
</body>
</html>
